# Netlify-Konfiguration für die MYNDS-Landing-Page.
# Dieses Repository enthält nur die Landing-Page; veröffentlicht wird der
# statische Ordner landing/ (kein Build-Step).
# Hinweis: command = "" verhindert, dass Netlify einen Build versucht.
[build]
  command = ""
  publish = "landing"

[build.environment]
  NODE_VERSION = "22"
