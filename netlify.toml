# Netlify-Konfiguration für die MYNDS-Landing-Page.
# Repo-Wurzel = App-Projekt; veröffentlicht wird NUR der statische Ordner landing/.
# Wichtig: command = "" überschreibt den beim Repo-Import automatisch
# eingetragenen Expo-Web-Build ("expo export -p web") — die Landing-Page
# ist statisch und braucht keinen Build-Step.
[build]
  command = ""
  publish = "landing"

[build.environment]
  NODE_VERSION = "22"
